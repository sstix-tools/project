name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test project commands
        run: |
          set -euo pipefail
          temp_root="$(mktemp -d)"
          trap 'rm -rf "$temp_root"' EXIT
          project_path="$temp_root/example"
          mkdir -p "$project_path"
          export PROJECT_DB_DIR="$temp_root/db"

          ./bin/project --help
          ./bin/project -a example "$project_path"
          test "$(./bin/project --print-path example)" = "$project_path"
          ./bin/project -d example "Example project"

          info="$(./bin/project -i example)"
          [[ "$info" == *"$project_path"* ]]
          [[ "$info" == *"Example project"* ]]
          listing="$(./bin/project -l)"
          [[ "$listing" == *"example"* ]]
